<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1200" height="830" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1200" height="70" fill="#1f4e9c"/>
  <text x="600" y="32" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">SƠ ĐỒ ĐẤU DÂY – CYD AI SAFETY HUB (ESP32-2432S028R)</text>
  <text x="600" y="57" fill="#dce6f7" font-size="15" text-anchor="middle">AI chatbot + đo CO₂ + cảnh báo sạc xe điện + Telegram + trang web – chỉ dùng các cổng có sẵn trên CYD</text>

  <!-- ===== CYD board ===== -->
  <rect x="430" y="240" width="370" height="250" rx="14" fill="#f2c230" stroke="#9a7a10" stroke-width="3"/>
  <rect x="540" y="265" width="175" height="140" rx="6" fill="#16213a"/>
  <text x="627" y="325" fill="#7fd1ff" font-size="17" text-anchor="middle" font-weight="700">TFT 2.8" cảm ứng</text>
  <text x="627" y="350" fill="#ffffff" font-size="13" text-anchor="middle">CO₂ 873 ppm · AN TOÀN</text>
  <text x="650" y="450" font-size="17" font-weight="700" text-anchor="middle" fill="#3a2c00">CYD ESP32-2432S028R</text>
  <text x="650" y="470" font-size="12" text-anchor="middle" fill="#3a2c00">LED RGB có sẵn (IO4/16/17) · Wi-Fi</text>
  <rect x="575" y="490" width="80" height="22" fill="#ccc" stroke="#333"/><text x="615" y="506" font-size="12" text-anchor="middle">micro-USB 5V</text>

  <!-- connectors + pin labels inside board -->
  <rect x="415" y="285" width="30" height="70" fill="#fff" stroke="#333"/>
  <text x="430" y="278" font-size="13" text-anchor="middle" font-weight="700">CN1</text>
  <rect x="415" y="375" width="30" height="70" fill="#fff" stroke="#333"/>
  <text x="430" y="470" font-size="13" text-anchor="middle" font-weight="700">P3</text>
  <rect x="785" y="285" width="30" height="70" fill="#fff" stroke="#333"/>
  <text x="800" y="278" font-size="13" text-anchor="middle" font-weight="700">P1</text>
  <rect x="785" y="410" width="30" height="34" fill="#fff" stroke="#333"/>
  <text x="800" y="465" font-size="13" text-anchor="middle" font-weight="700">SPEAK</text>
  <g font-size="11" fill="#3a2c00">
    <text x="450" y="301">GND</text><text x="450" y="317">IO22 SCL</text><text x="450" y="333">IO27 SDA</text><text x="450" y="349">3V3</text>
    <text x="450" y="391">GND</text><text x="450" y="407">IO35 ADC</text><text x="450" y="423">IO22</text><text x="450" y="439">IO21</text>
    <text x="780" y="301" text-anchor="end">VIN 5V</text><text x="780" y="317" text-anchor="end">TX</text>
    <text x="780" y="333" text-anchor="end">RX</text><text x="780" y="349" text-anchor="end">GND</text>
    <text x="780" y="431" text-anchor="end">Loa</text>
  </g>

  <!-- ===== I2C bus ===== -->
  <text x="220" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="#1f4e9c">BUS I2C chung (các module cắm song song)</text>
  <line x1="40" y1="140" x2="380" y2="140" stroke="#d62020" stroke-width="3"/><text x="44" y="133" font-size="12" fill="#d62020">3V3</text>
  <line x1="40" y1="160" x2="380" y2="160" stroke="#222" stroke-width="3"/><text x="44" y="155" font-size="12">GND</text>
  <line x1="40" y1="190" x2="380" y2="190" stroke="#e0a000" stroke-width="3"/><text x="44" y="184" font-size="12" fill="#a87800">SDA → IO27</text>
  <line x1="40" y1="210" x2="380" y2="210" stroke="#1f9e3a" stroke-width="3"/><text x="44" y="228" font-size="12" fill="#1f9e3a">SCL → IO22</text>
  <path d="M380 140 H405 V349 H415" fill="none" stroke="#d62020" stroke-width="3"/>
  <path d="M380 160 H397 V301 H415" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M380 190 H390 V333 H415" fill="none" stroke="#e0a000" stroke-width="3"/>
  <path d="M380 210 H383 V317 H415" fill="none" stroke="#1f9e3a" stroke-width="3"/>

  <rect x="40" y="245" width="155" height="80" rx="8" fill="#e8f1ff" stroke="#1f4e9c"/>
  <text x="117" y="270" font-size="15" font-weight="700" text-anchor="middle">SCD41</text>
  <text x="117" y="290" font-size="12" text-anchor="middle">CO₂ / nhiệt / ẩm phòng</text>
  <text x="117" y="309" font-size="12" text-anchor="middle">I2C 0x62 · 3.3V</text>
  <line x1="117" y1="245" x2="117" y2="210" stroke="#888" stroke-dasharray="4 3"/>
  <rect x="210" y="245" width="160" height="80" rx="8" fill="#ffeede" stroke="#c4590d"/>
  <text x="290" y="270" font-size="15" font-weight="700" text-anchor="middle">MLX90614 (GY-906)</text>
  <text x="290" y="290" font-size="12" text-anchor="middle">Nhiệt hồng ngoại, chĩa vào</text>
  <text x="290" y="308" font-size="12" text-anchor="middle">cục sạc/pin · I2C 0x5A</text>
  <line x1="290" y1="245" x2="290" y2="210" stroke="#888" stroke-dasharray="4 3"/>

  <!-- ===== MQ-2 + divider ===== -->
  <rect x="40" y="370" width="175" height="105" rx="8" fill="#f3e8ff" stroke="#7a3db8"/>
  <text x="127" y="395" font-size="15" font-weight="700" text-anchor="middle">MQ-2</text>
  <text x="127" y="414" font-size="12" text-anchor="middle">Khói / khí gas</text>
  <text x="127" y="432" font-size="12" text-anchor="middle" fill="#d62020">VCC = 5V lấy từ P1 VIN</text>
  <text x="127" y="450" font-size="12" text-anchor="middle">GND chung · làm nóng 3 phút</text>
  <path d="M215 407 H245" stroke="#7a3db8" stroke-width="3"/><text x="219" y="400" font-size="11" fill="#7a3db8">AO</text>
  <rect x="245" y="399" width="44" height="16" fill="#fff" stroke="#7a3db8"/><text x="267" y="411" font-size="11" text-anchor="middle">10k</text>
  <path d="M289 407 H415" stroke="#7a3db8" stroke-width="3"/>
  <line x1="330" y1="407" x2="330" y2="425" stroke="#7a3db8" stroke-width="3"/>
  <rect x="322" y="425" width="16" height="38" fill="#fff" stroke="#7a3db8"/><text x="344" y="448" font-size="11">15k</text>
  <path d="M330 463 V480 H400 V391 H415" stroke="#222" stroke-width="3" fill="none"/><text x="345" y="476" font-size="11">GND</text>

  <!-- P1 5V stub -->
  <path d="M815 301 H865" stroke="#d62020" stroke-width="3"/><text x="870" y="305" font-size="12" fill="#d62020">5V → VCC MQ-2</text>
  <path d="M815 349 H865" stroke="#222" stroke-width="3"/><text x="870" y="353" font-size="12">GND chung</text>

  <!-- speaker -->
  <path d="M815 427 H850" stroke="#222" stroke-width="3"/>
  <circle cx="882" cy="427" r="30" fill="#333"/><circle cx="882" cy="427" r="11" fill="#777"/>
  <text x="922" y="422" font-size="14" font-weight="700">Loa 8Ω 1–2W</text>
  <text x="922" y="440" font-size="12">= còi báo động</text>

  <!-- ===== Phone ===== -->
  <rect x="975" y="95" width="200" height="270" rx="22" fill="#222"/>
  <rect x="987" y="118" width="176" height="228" rx="6" fill="#fff"/>
  <rect x="987" y="118" width="176" height="32" fill="#2aa1da"/>
  <text x="1075" y="139" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">Telegram – bot của bạn</text>
  <rect x="995" y="160" width="150" height="44" rx="8" fill="#ffe1e1"/>
  <text x="1003" y="177" font-size="11" fill="#b00" font-weight="700">🚨 KHẨN CẤP khi sạc</text>
  <text x="1003" y="195" font-size="11">Nhiệt 72°C · có khói</text>
  <rect x="1010" y="212" width="145" height="28" rx="8" fill="#d8f3d0"/>
  <text x="1018" y="230" font-size="11">Phòng bí quá không?</text>
  <rect x="995" y="248" width="150" height="44" rx="8" fill="#eef2f7"/>
  <text x="1003" y="265" font-size="11">CO₂ 1.250 ppm, nên</text>
  <text x="1003" y="282" font-size="11">mở cửa 10 phút nhé 🌿</text>
  <text x="1075" y="385" font-size="13" text-anchor="middle">Cảnh báo + chat AI</text>
  <path d="M800 255 C 860 200, 910 190, 970 210" stroke="#2aa1da" stroke-width="3" stroke-dasharray="8 5" fill="none"/>
  <text x="840" y="200" font-size="13" fill="#2aa1da" font-weight="700">Wi-Fi / Internet</text>

  <!-- ===== Charging chain (DC side only) ===== -->
  <text x="40" y="545" font-size="15" font-weight="700" fill="#1f9e3a">ĐO DÒNG/ÁP SẠC (tùy chọn – chỉ phía DC)</text>
  <rect x="40" y="560" width="230" height="110" rx="8" fill="#eaf7ec" stroke="#1f9e3a"/>
  <text x="155" y="584" font-size="15" font-weight="700" text-anchor="middle">INA228 (≤85V)</text>
  <text x="155" y="603" font-size="12" text-anchor="middle">hoặc INA226 nếu pin ≤36V</text>
  <text x="155" y="621" font-size="12" text-anchor="middle">Shunt 0.01Ω (R010) → tới ~8A</text>
  <text x="155" y="639" font-size="12" text-anchor="middle">VCC 3.3V · SDA/SCL vào bus I2C</text>
  <text x="155" y="657" font-size="12" text-anchor="middle">I2C 0x40</text>
  <path d="M155 560 V525 H25 V210 H40" fill="none" stroke="#888" stroke-dasharray="4 3"/>

  <rect x="340" y="560" width="140" height="70" rx="8" fill="#eee" stroke="#555"/>
  <text x="410" y="588" font-size="14" font-weight="700" text-anchor="middle">Bộ sạc xe</text>
  <text x="410" y="607" font-size="12" text-anchor="middle">DC ra 48–72V</text>
  <path d="M340 580 H270" stroke="#d62020" stroke-width="3"/><text x="280" y="574" font-size="11" fill="#d62020">DC+ → IN+</text>
  <path d="M270 650 H300 V727 H160" stroke="#d62020" stroke-width="3" fill="none"/><text x="168" y="720" font-size="11" fill="#d62020">IN− → cực + pin xe</text>
  <rect x="40" y="702" width="120" height="50" rx="6" fill="#444"/><text x="100" y="732" fill="#fff" font-size="13" text-anchor="middle">Pin xe</text>
  <path d="M360 630 V785 H100 V752" stroke="#222" stroke-width="3" fill="none"/><text x="140" y="800" font-size="11">DC− → cực − pin xe (nối chung GND với INA)</text>

  <rect x="500" y="565" width="130" height="60" rx="8" fill="#eee" stroke="#555"/>
  <text x="565" y="590" font-size="13" font-weight="700" text-anchor="middle">Ổ cắm thông minh</text>
  <text x="565" y="608" font-size="11" text-anchor="middle">tùy chọn · Wi-Fi</text>
  <path d="M500 595 H480" stroke="#555" stroke-width="3"/><text x="490" y="555" font-size="11" text-anchor="middle">220V AC</text>
  <text x="565" y="640" font-size="11" text-anchor="middle" fill="#b00">tự ngắt khi KHẨN CẤP</text>

  <!-- ===== Notes ===== -->
  <rect x="660" y="540" width="520" height="275" rx="10" fill="#fff8e1" stroke="#e0a000"/>
  <text x="678" y="568" font-size="16" font-weight="700" fill="#8a5b00">ĐÃ SỬA SO VỚI SƠ ĐỒ TRÊN MẠNG</text>
  <g font-size="13" fill="#333">
    <text x="678" y="595">• INA219 chỉ chịu 26V → pin xe 48–72V sẽ cháy. Dùng INA228.</text>
    <text x="678" y="619">• MQ-2 AO ra tới 5V → bắt buộc cầu chia 10k/15k vào GPIO35.</text>
    <text x="678" y="643">• Không cắm còi/LED 5V thẳng vào GPIO: dùng loa + LED RGB</text>
    <text x="690" y="661">có sẵn trên CYD.</text>
    <text x="678" y="685">• Không dùng GPIO1/3 (TX/RX). Không cần thêm LDO 3.3V.</text>
    <text x="678" y="709">• KHÔNG đo trực tiếp 220V. Ngắt sạc bằng ổ cắm thông minh.</text>
    <text x="678" y="733">• MLX90614 đo không tiếp xúc, đặt cách cục sạc/pin 2–5 cm.</text>
    <text x="678" y="757">• Mọi cảm biến đều tùy chọn: thiếu cái nào máy tự bỏ qua.</text>
    <text x="678" y="790" font-weight="700" fill="#b00">Thiết bị hỗ trợ cảnh báo – không thay đầu báo khói</text>
    <text x="678" y="806" font-weight="700" fill="#b00">đạt chuẩn PCCC, cầu chì và aptomat.</text>
  </g>
</svg>
