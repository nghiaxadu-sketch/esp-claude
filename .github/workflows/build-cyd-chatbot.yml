name: Build CYD AI Chatbot (Arduino)

on:
  push:
    paths:
      - "arduino/**"
      - ".github/workflows/build-cyd-chatbot.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ESP32_CORE_VERSION: "3.3.7"
  FQBN: "esp32:esp32:esp32c5:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=enabled,CDCOnBoot=cdc"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test bỏ dấu tiếng Việt / ngắt dòng (chạy trên máy CI)
        working-directory: arduino/cyd_ai_chatbot/test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I.. ../text_utils.cpp text_utils_test.cpp -o text_utils_test
          ./text_utils_test

      - uses: arduino/setup-arduino-cli@v2

      - name: Cài core ESP32 và thư viện
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${ESP32_CORE_VERSION}
          arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library" "ArduinoJson"

      - name: Compile cho NM-CYD-C5 (ESP32-C5)
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings default --export-binaries \
            --output-dir build arduino/cyd_ai_chatbot
          ls -la build

      - name: Compile Wi-Fi Dead Zone Finder
        run: |
          arduino-cli compile --fqbn "$FQBN" --warnings default --export-binaries \
            --output-dir build_deadzone arduino/wifi_deadzone_cyd_c5

      - name: Compile Wi-Fi Dead Zone Finder (secrets.h giả chỉ để build)
        run: |
          cp arduino/c3_wifi_deadzone_cyd/secrets.h.example arduino/c3_wifi_deadzone_cyd/secrets.h
          arduino-cli compile --fqbn "$FQBN" --warnings default --export-binaries \
            --output-dir build_deadzone arduino/c3_wifi_deadzone_cyd

      - uses: actions/upload-artifact@v4
        with:
          name: cyd-ai-chatbot-nm_cyd_c5
          path: |
            build/cyd_ai_chatbot.ino.merged.bin
            build/cyd_ai_chatbot.ino.bin
            build_deadzone/wifi_deadzone_cyd_c5.ino.merged.bin

      - name: Compile Wi-Fi Dead Zone Finder cho NM-CYD-C5
        run: |
          cp arduino/c3_wifi_deadzone_cyd/secrets.h.example arduino/c3_wifi_deadzone_cyd/secrets.h
          arduino-cli compile --fqbn "$FQBN" --warnings default --export-binaries \
            --output-dir build_deadzone arduino/c3_wifi_deadzone_cyd
          ls -la build_deadzone

      - uses: actions/upload-artifact@v4
        with:
          name: wifi-deadzone-nm_cyd_c5
          path: build_deadzone/c3_wifi_deadzone_cyd.ino.merged.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-wifi-deadzone-nm_cyd_c5
          path: build_deadzone/c3_wifi_deadzone_cyd.ino.merged.bin
